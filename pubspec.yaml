name: bdc_website_v2
description: Bennett Chamberlain personal site — deployed as Flutter Web (responsive).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.3.7
  firebase_analytics: ^11.4.5
  firebase_ui_auth: ^1.16.1

  go_router: ^16.0.0
  rive: ^0.13.0
  get_storage: ^2.1.1
  url_launcher: ^6.3.0
  marquee: ^2.3.0
  animated_text_kit: ^4.2.2
  font_awesome_flutter: ^10.7.0
  video_player: ^2.9.0
  universal_io: ^2.3.0
  flutter_riverpod: ^2.6.1
  cupertino_icons: ^1.0.8
  get_it: ^8.0.0
  loading_overlay: ^0.4.2
  logger: ^2.5.0
  lottie: ^3.1.0
  stacked: ^3.4.2
  responsive_builder: ^0.7.1
  equatable: ^2.0.7
  file_picker: ^8.1.0
  percent_indicator: ^4.2.4
  syncfusion_flutter_pdfviewer: ^31.1.19
  carousel_slider: ^5.0.0
  custom_alert_dialog_box: ^1.0.2
  quill_html_editor: 2.2.8
  fast_cached_network_image: ^1.2.0
  quds_popup_menu: ^0.0.1+1
  flutter_ad_manager_web:
    path: packages/flutter_ad_manager_web
  admanager_web: ^0.0.3
  line_icons: ^2.0.3
  json_dynamic_widget: ^12.0.0
  flutter_colorpicker: ^1.1.0
  hexcolor: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/files/
  fonts:
    - family: Primetime
      fonts:
        - asset: assets/fonts/PRIMETIME.ttf
    - family: Helvetica
      fonts:
        - asset: assets/fonts/Helvetica-Bold.ttf
          weight: 600
        - asset: assets/fonts/Helvetica-BoldOblique.ttf
          weight: 800
        - asset: assets/fonts/Helvetica-light-1.ttf
          weight: 100
        - asset: assets/fonts/Helvetica-Oblique.ttf
          weight: 500
        - asset: assets/fonts/Helvetica.ttf
          weight: 400

# Web is the supported target; release build often needs:
#   flutter build web --no-tree-shake-icons
# (json_theme uses non-const IconData; full Material icons subset is preserved.)
dependency_overrides:
  get: ^4.7.3
  file_picker: ^8.1.0
